<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Ilustración lineal de equipo básico de montaña: mochila, botas, bastones, botella, linterna frontal y brújula">
  <title>equipment.svg · placeholder editorial de equipo y preparación</title>
  <defs>
    <linearGradient id="e-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2823"/>
      <stop offset="100%" stop-color="#111817"/>

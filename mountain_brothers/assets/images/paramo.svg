<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Ilustración de páramo andino con frailejones sobre laderas cubiertas de neblina">
  <title>paramo.svg · placeholder editorial de páramo y frailejones</title>
  <defs>
    <linearGradient id="p-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4e40"/>
      <stop offset="60%" stop-color="#26372d"/>
      <stop offset="100%" stop-color="#141d1a"/>
    </linearGradient>
    <linearGradient id="p-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d5f4c"/>
      <stop offset="100%" stop-color="#384636"/>
    </linearGradient>
    <linearGradient id="p-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a3a"/>
      <stop offset="100%" stop-color="#26332b"/>
    </linearGradient>
    <linearGradient id="p-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2b24"/>
      <stop offset="100%" stop-color="#0d1412"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="0.5" cy="0.58" r="0.6">
      <stop offset="0" stop-color="#b6a58b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b6a58b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="p-mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e0d4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e4e0d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e4e0d4" stop-opacity="0"/>
    </linearGradient>

    <!-- Hoja de frailejón: curva ascendente hacia el exterior -->
    <path id="p-leaf" d="M0 0 C 7 -17 17 -33 40 -46 C 27 -28 17 -13 12 0 Z" fill="#7f8c69"/>

    <!-- Frailejón: tallo denso + roseta superior + roseta media -->
    <g id="p-frailejon">
      <path d="M-7 0 C -5 -40 -5 -80 -4 -132 L4 -132 C 5 -80 5 -40 7 0 Z" fill="#6f7c5f"/>
      <g transform="translate(0,-132)">
        <use href="#p-leaf" transform="rotate(0)"/>
        <use href="#p-leaf" transform="rotate(36)"/>
        <use href="#p-leaf" transform="rotate(72)"/>
        <use href="#p-leaf" transform="rotate(108)"/>
        <use href="#p-leaf" transform="rotate(144)"/>
        <use href="#p-leaf" transform="rotate(180)"/>
        <use href="#p-leaf" transform="rotate(216)"/>
        <use href="#p-leaf" transform="rotate(252)"/>
        <use href="#p-leaf" transform="rotate(288)"/>
        <use href="#p-leaf" transform="rotate(324)"/>
      </g>
      <g transform="translate(0,-78) scale(0.62)">
        <use href="#p-leaf" transform="rotate(20)"/>
        <use href="#p-leaf" transform="rotate(70)"/>
        <use href="#p-leaf" transform="rotate(120)"/>
        <use href="#p-leaf" transform="rotate(170)"/>
        <use href="#p-leaf" transform="rotate(220)"/>
        <use href="#p-leaf" transform="rotate(270)"/>
        <use href="#p-leaf" transform="rotate(320)"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#p-sky)"/>
  <rect width="1600" height="1000" fill="url(#p-glow)"/>

  <path fill="url(#p-far)" opacity="0.8"
    d="M0 520 L130 456 L260 508 L400 434 L540 502 L690 428 L840 506 L990 438 L1140 510 L1290 444 L1440 512 L1600 452 L1600 1000 L0 1000 Z"/>

  <rect y="470" width="1600" height="140" fill="url(#p-mist)"/>

  <path fill="url(#p-mid)"
    d="M0 648 L170 588 L330 646 L500 578 L660 648 L830 584 L1000 650 L1170 590 L1340 652 L1500 596 L1600 640 L1600 1000 L0 1000 Z"/>

  <!-- Frailejones lejanos -->
  <g opacity="0.42">
    <g transform="translate(210,690) scale(0.34)"><use href="#p-frailejon"/></g>
    <g transform="translate(430,704) scale(0.3)"><use href="#p-frailejon"/></g>
    <g transform="translate(1180,700) scale(0.32)"><use href="#p-frailejon"/></g>
    <g transform="translate(1420,712) scale(0.28)"><use href="#p-frailejon"/></g>
  </g>

  <rect y="620" width="1600" height="170" fill="url(#p-mist)" opacity="0.75"/>

  <path fill="url(#p-near)"
    d="M0 812 L160 762 L340 818 L520 758 L700 816 L880 756 L1060 818 L1240 760 L1420 820 L1600 768 L1600 1000 L0 1000 Z"/>

  <!-- Frailejones en primer plano -->
  <g opacity="0.95">
    <g transform="translate(120,900) scale(0.96)"><use href="#p-frailejon"/></g>
    <g transform="translate(560,930) scale(1.12)"><use href="#p-frailejon"/></g>
    <g transform="translate(1010,918) scale(1.02)"><use href="#p-frailejon"/></g>
    <g transform="translate(1470,940) scale(1.2)"><use href="#p-frailejon"/></g>
  </g>

  <path fill="#0a0f0e" d="M0 942 L240 922 L520 948 L800 920 L1080 950 L1360 924 L1600 946 L1600 1000 L0 1000 Z"/>
</svg>

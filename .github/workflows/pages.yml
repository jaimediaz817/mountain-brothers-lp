name: Deploy Mountain Brothers LP to Pages
on:
  push:
    branches: [main]
    paths:
      - "mountain_brothers/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar referencias locales (evita 404 en produccion)
        run: |
          set -e
          cd mountain_brothers
          # Rutas locales declaradas en el HTML: src, href y poster.
          grep -oE '(src|href|poster)="assets/[^"]+"' index.html \
            | sed -E 's/^[a-z]+="//; s/"$//' | sort -u > /tmp/refs.txt
          echo "Referencias locales unicas: $(wc -l < /tmp/refs.txt)"
          faltan=0
          while IFS= read -r ref; do
            if [ ! -f "$ref" ]; then
              echo "::error title=Referencia rota::No existe en el repo: $ref (daria 404 en produccion)"
              faltan=$((faltan+1))
            fi
          done < /tmp/refs.txt
          if [ "$faltan" -ne 0 ]; then
            echo "::error::Deploy abortado: $faltan referencia(s) apuntan a archivos que no estan en el repositorio."
            echo "Suele pasar al commitear el HTML sin su JS/CSS: revisa 'git status' y añade los archivos que falten."
            exit 1
          fi
          echo "OK: las $(wc -l < /tmp/refs.txt) referencias locales existen en el repo."

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact (solo mountain_brothers/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: mountain_brothers
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
